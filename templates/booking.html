<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation – {{ competition['name'] }} | GUDLFT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .booking-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .card-header-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 2rem;
            color: #fff;
        }
        .card-header-gradient h1 { font-weight: 700; font-size: 1.4rem; }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
        }
        .btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; color: #fff; font-weight: 600;
            border-radius: 10px; padding: 0.7rem 2rem;
            transition: all 0.3s;
        }
        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.5);
            color: #fff;
        }
        .places-info {
            background: rgba(102,126,234,0.1);
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 12px; padding: 1rem;
        }
        [data-bs-theme="dark"] .booking-card { background: #1e1e2e; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card booking-card">
                <!-- Header -->
                <div class="card-header-gradient">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span style="font-size:2rem;">🎟️</span>
                        <div>
                            <p class="mb-0 opacity-75 small text-uppercase tracking-wide">Réservation</p>
                            <h1 class="mb-0">{{ competition['name'] }}</h1>
                        </div>
                    </div>
                </div>

                <!-- Body -->
                <div class="card-body p-4">
                    <div class="places-info mb-4">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-people-fill text-primary me-3 fs-4"></i>
                            <div>
                                <div class="fw-600 fs-5">{{ competition['numberOfPlaces'] }}</div>
                                <div class="text-muted small">places disponibles</div>
                            </div>
                        </div>
                    </div>

                    <form action="/purchasePlaces" method="post">
                        <input type="hidden" name="club" value="{{ club['name'] }}">
                        <input type="hidden" name="competition" value="{{ competition['name'] }}">

                        <div class="mb-4">
                            <label for="places" class="form-label fw-500">
                                <i class="bi bi-hash me-1"></i> Nombre de places (max 12)
                            </label>
                            <input type="number" name="places" id="places"
                                   class="form-control form-control-lg rounded-3"
                                   min="1" max="12" placeholder="1"
                                   required>
                            <div class="form-text mt-1">
                                <i class="bi bi-info-circle me-1"></i>
                                Maximum 12 places par réservation.
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-confirm btn-primary fs-5">
                                <i class="bi bi-check-lg me-2"></i> Confirmer la réservation
                            </button>
                            <a href="javascript:history.back()"
                               class="btn btn-outline-secondary rounded-3">
                                <i class="bi bi-arrow-left me-2"></i> Retour au tableau de bord
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3 text-white-50 small">
                Club : <strong class="text-white">{{ club['name'] }}</strong>
                — {{ club['points'] }} points disponibles
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-bs-theme', saved);
</script>
</body>
</html>
