<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT – Espace Secrétaires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }
        [data-bs-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.95);
        }
        .brand-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }
        .points-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .points-link:hover {
            color: #fff;
        }
        h1 { font-weight: 700; }
        .subtitle { font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3 rounded-3" role="alert">
                        <i class="bi bi-{% if category == 'success' %}check-circle{% else %}exclamation-triangle{% endif %}-fill me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="card login-card p-4 p-md-5">
                    <div class="brand-icon">
                        🏋️
                    </div>
                    <h1 class="text-center fs-3 mb-1">GUDLFT</h1>
                    <p class="text-center subtitle mb-4">Espace Secrétaires</p>

                    <form action="{{ url_for('showSummary') }}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-500">
                                <i class="bi bi-envelope me-1"></i> Adresse e-mail
                            </label>
                            <input type="email" name="email" id="email"
                                   class="form-control form-control-lg rounded-3"
                                   placeholder="secretaire@club.fr"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-login btn-primary w-100 fs-5 text-white">
                            Accéder au tableau de bord
                            <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <hr class="my-4 opacity-25">
                    <div class="text-center">
                        <a href="{{ url_for('points') }}" class="points-link">
                            <i class="bi bi-trophy me-1"></i>
                            Voir le classement public des clubs
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Apply saved theme on load
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', saved);
    </script>
</body>
</html>
